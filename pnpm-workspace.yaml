packages:
  - apps/*
  - libs/*

allowBuilds:
  '@nestjs/core': true
  '@openapitools/openapi-generator-cli': true
  '@parcel/watcher': true
  '@scarf/scarf': true
  '@swc/core': true
  esbuild: true
  less: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@nx/angular@22.7.12'
  - '@nx/devkit@22.7.12'
  - '@nx/docker@22.7.12'
  - '@nx/eslint-plugin@22.7.12'
  - '@nx/eslint@22.7.12'
  - '@nx/jest@22.7.12'
  - '@nx/js@22.7.12'
  - '@nx/module-federation@22.7.12'
  - '@nx/nest@22.7.12'
  - '@nx/node@22.7.12'
  - '@nx/nx-darwin-arm64@22.7.12'
  - '@nx/nx-darwin-x64@22.7.12'
  - '@nx/nx-freebsd-x64@22.7.12'
  - '@nx/nx-linux-arm-gnueabihf@22.7.12'
  - '@nx/nx-linux-arm64-gnu@22.7.12'
  - '@nx/nx-linux-arm64-musl@22.7.12'
  - '@nx/nx-linux-x64-gnu@22.7.12'
  - '@nx/nx-linux-x64-musl@22.7.12'
  - '@nx/nx-win32-arm64-msvc@22.7.12'
  - '@nx/nx-win32-x64-msvc@22.7.12'
  - '@nx/rspack@22.7.12'
  - '@nx/web@22.7.12'
  - '@nx/webpack@22.7.12'
  - '@nx/workspace@22.7.12'
  - nx@22.7.12
