[package]
name = "r4-root-common-readonly-review"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std", "serde", "clock"] }
uuid = { version = "=1.29.0", default-features = false, features = ["std", "serde"] }
sha2 = { version = "=0.11.1" }
