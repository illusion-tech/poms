[package]
name = "poms-r4def-summary-candidate32"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace]
resolver = "3"

[[bin]]
name = "r4def_summary_producer32"
path = "r4def_summary_producer32.rs"

[dependencies]
poms-api-rust = { path = "../../../../apps/poms-api-rust" }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "chrono", "rust_decimal", "uuid", "json"] }
tokio = { version = "=1.54.1", default-features = false, features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "=1.29.0", default-features = false, features = ["std", "serde"] }
