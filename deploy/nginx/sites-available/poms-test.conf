upstream poms_api_test {
    server 127.0.0.1:3333;
    keepalive 16;
}

server {
    listen 80;
    server_name poms-test.illusiontech.cn;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name poms-test.illusiontech.cn;

    ssl_certificate /etc/nginx/ssl/poms-test/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/poms-test/privkey.pem;

    root /srv/poms/test/current/admin/browser;
    index index.html;

    client_max_body_size 64m;

    access_log /var/log/nginx/poms-test.access.log;
    error_log /var/log/nginx/poms-test.error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /api/ {
        proxy_pass http://poms_api_test;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        add_header Cache-Control "no-store" always;
    }

    location = /api-docs {
        return 301 /api-docs/;
    }

    location ^~ /api-docs/ {
        proxy_pass http://poms_api_test;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        add_header Cache-Control "no-store" always;
    }

    location = /api-docs-json {
        proxy_pass http://poms_api_test;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        add_header Cache-Control "no-store" always;
    }

    location = /api-docs-yaml {
        proxy_pass http://poms_api_test;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        add_header Cache-Control "no-store" always;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location ~* \.(?:js|mjs|css|woff2?|ttf|eot|png|jpg|jpeg|gif|webp|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
